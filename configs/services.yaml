    tags: [nas, placeholder]

  - id: obsidian_sync_placeholder
    name: Obsidian sync service placeholder
    device_id: epixnas_rpi
    type: obsidian_sync
    endpoint: sync_service_not_selected
    expected_status: missing_design_choice
