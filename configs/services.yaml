    expected_status: expected_offline_until_powered
    dependencies: [contabo_vless, contabo_hy2]
    tags: [gateway, mihomo, dry_run_only]

  - id: minipc_tailscale_exit
    name: miniPC Tailscale Exit Node
    device_id: minipc_gateway
