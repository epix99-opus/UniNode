    endpoint: missing_tailscale_ip
    expected_status: missing_fact
    dependencies: []
    tags: [tailscale, exit_node, evidence_gap]

  - id: epixnas_nas
    name: EpixNAS NAS placeholder
    device_id: epixnas_rpi
    type: nas
    endpoint: 192.168.50.2
    expected_status: expected_offline_until_powered
