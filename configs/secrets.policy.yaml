scan:
  include_extensions:
    - .env
    - .yaml
    - .yml
    - .json
    - .sh
    - .py
    - .ts
    - .tsx
  ignore_dirs:
    - .git
    - node_modules
    - .venv
    - dist
    - __pycache__
patterns:
  - id: uuid
    label: UUID
    regex: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
  - id: password
    label: Password
    regex: '(?i)password\s*[:=]\s*[^\s''"]+'
  - id: private_key
    label: Private key
    regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - id: token
    label: Token
    regex: '(?i)token\s*[:=]\s*[^\s''"]+'
  - id: auth_key
    label: Auth key
    regex: '(?i)auth[_-]?key\s*[:=]\s*[^\s''"]+'
  - id: subscription_url
    label: Subscription sensitive URL
    regex: 'https?://[^\s''"]*(?:token|uuid|sub|subscribe)[^\s''"]*'
